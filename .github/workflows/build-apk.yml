name: Build & Release KhangFlix APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Debug Keystore for Signing
        run: |
          cd android/app
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Make Gradle Wrapper
        run: |
          cd android
          gradle wrapper --gradle-version 8.2

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KhangFlix-Release-APK
          path: android/app/build/outputs/apk/release/*.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: apk-latest
          name: "KhangFlix APK (Tối ưu Oppo A71k)"
          body: |
            ### 🚀 KhangFlix v1.0.0 (Oppo A71k Edition)
            - Dung lượng siêu nhẹ (~2.5MB)
            - Hỗ trợ Android 7.1+, RAM 2GB, chip Snapdragon 450
            - Tích hợp Google Drive 5TB stream + Tải ngầm về máy
          files: android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
