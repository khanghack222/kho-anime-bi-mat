name: Auto Anime Sync to Drive

on:
  schedule:
    - cron: '0 */6 * * *' # Chạy tự động mỗi 6 tiếng một lần
  workflow_dispatch:
    inputs:
      max_episodes:
        description: 'Số lượng tập cần tải lần này'
        required: true
        default: '20'

permissions:
  contents: write

jobs:
  sync-anime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Aria2 and Rclone
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y aria2 rclone

      - name: Setup Rclone Config
        env:
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG_DATA }}
        run: |
          python -c '
          import os, pathlib
          conf = os.environ.get("RCLONE_CONFIG_DATA", "").strip()
          if conf.startswith("\ufeff"):
              conf = conf[1:]
          conf = conf.replace("\r\n", "\n")
          conf_path = pathlib.Path.home() / ".config" / "rclone" / "rclone.conf"
          conf_path.parent.mkdir(parents=True, exist_ok=True)
          conf_path.write_text(conf, encoding="utf-8")
          print("Rclone config written successfully.")
          '
          echo "Kiểm tra kết nối Google Drive..."
          rclone lsd gdrive:

      - name: Run Auto Sync Worker
        env:
          MAX_EPISODES: ${{ github.event.inputs.max_episodes || '20' }}
          RCLONE_CONFIG_DATA: "configured"
          DRIVE_DEST: "gdrive:KhangFlix_Anime"
        run: |
          python auto_sync_drive.py

      - name: Commit Catalog Changes (if any)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Auto Anime Bot"
          git add catalog.json || true
          git commit -m "Auto update anime catalog from Drive" || true
          git push || true
